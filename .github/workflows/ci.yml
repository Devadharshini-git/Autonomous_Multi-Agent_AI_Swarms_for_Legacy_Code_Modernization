name: Test and Build Generated Services

on:
  push:
    branches: [main]
    paths:
      - 'generated/**'
  workflow_dispatch:  # allows manually triggering from the GitHub Actions tab

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [inventory_service]
        # Add more service names here as your pipeline generates them,
        # e.g. [inventory_service, user_auth_service]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install service dependencies
        working-directory: generated/${{ matrix.service }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: generated/${{ matrix.service }}
        run: pytest test_main.py -v --cov=. --cov-report=term-missing

      - name: Log in to GitHub Container Registry
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: success()
        working-directory: generated/${{ matrix.service }}
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest .

      - name: Push Docker image to GHCR
        if: success()
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest